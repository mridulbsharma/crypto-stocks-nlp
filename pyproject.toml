[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptosentinel"
version = "1.0.0"
description = "Agentic AI System for Grounded Crypto & Stock Market Intelligence"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "CryptoSentinel Team"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment",
]
keywords = [
    "nlp",
    "sentiment-analysis",
    "cryptocurrency",
    "stocks",
    "reddit",
    "machine-learning",
    "agentic-ai",
    "mcp",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "streamlit>=1.28.0",
    "nltk>=3.8.1",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "praw>=7.7.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]
transformers = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
]
viz = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "wordcloud>=1.9.0",
]
all = [
    "cryptosentinel[dev,transformers,viz]",
]

[project.scripts]
cryptosentinel-api = "app.api:main"
cryptosentinel-mcp = "src.mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/yourusername/cryptosentinel"
Documentation = "https://github.com/yourusername/cryptosentinel#readme"
Repository = "https://github.com/yourusername/cryptosentinel"
Issues = "https://github.com/yourusername/cryptosentinel/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*", "evals*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["evals"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src", "app"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
